<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Outer Ring Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Play Symbol Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="accentGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Ambient Light Orbs -->
  <circle cx="350" cy="350" r="240" fill="#6366f1" opacity="0.25" filter="url(#accentGlow)"/>
  <circle cx="680" cy="680" r="220" fill="#ec4899" opacity="0.2" filter="url(#accentGlow)"/>

  <!-- Stylized Film Aperture / Orbital Cinema Ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#neonGrad)" stroke-width="36" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="12" stroke-dasharray="16 28"/>

  <!-- Cinema Reel Notches -->
  <circle cx="512" cy="192" r="24" fill="#38bdf8"/>
  <circle cx="788" cy="352" r="24" fill="#818cf8"/>
  <circle cx="788" cy="672" r="24" fill="#a855f7"/>
  <circle cx="512" cy="832" r="24" fill="#ec4899"/>
  <circle cx="236" cy="672" r="24" fill="#818cf8"/>
  <circle cx="236" cy="352" r="24" fill="#38bdf8"/>

  <!-- Core Prism Triangle / Play Button -->
  <path d="M 440 370 L 670 512 L 440 654 Z" fill="url(#playGrad)" filter="url(#glow)"/>

  <!-- Inner Sparkle Highlight -->
  <polygon points="512,410 528,450 568,466 528,482 512,522 496,482 456,466 496,450" fill="#ffffff" opacity="0.85"/>
</svg>
