name: 🚀 Tauri v2 Desktop Cross-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 Tag (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release 标题'
        required: false
        default: 'NovaStream Desktop Client'
      is_prerelease:
        description: '是否为预发布版本 (Pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  pre-check:
    name: 🔍 Pre-check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: 🔍 Type check
        run: npm run lint

  build-tauri:
    name: 📦 Build (${{ matrix.platform-name }})
    needs: pre-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform-name: macOS-Universal
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'

          - os: ubuntu-22.04
            platform-name: Linux-x64
            rust-targets: 'x86_64-unknown-linux-gnu'
            tauri-args: ''

          - os: windows-latest
            platform-name: Windows-x64
            rust-targets: 'x86_64-pc-windows-msvc'
            tauri-args: ''

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🐧 Install Linux system dependencies (WebKit2GTK 4.1)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf

      - name: 🍎 Install macOS Rust targets
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: ⚡ Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Install Node dependencies
        shell: bash
        run: |
          # Clean up corrupted cache
          rm -rf node_modules package-lock.json

          # Fresh install with clean state
          npm install --legacy-peer-deps

          # Explicitly rebuild the native binding for macOS ARM64
          npm rebuild @tailwindcss/oxide || true
          npm rebuild lightningcss || true

      - name: 🧹 Clear Tailwind oxide cache & Validate frontend build
        shell: bash
        run: |
          rm -rf node_modules/.tailwindcss/oxide-cache node_modules/.vite
          npm run build

      - name: 🏗️ Build & Package Desktop Application (Tauri v2)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || github.event.inputs.tag_name }}
          releaseName: ${{ github.event.inputs.release_title || github.event.inputs.tag_name || github.ref_name }}
          releaseBody: 'NovaStream 跨平台桌面客户端全自动发布 (macOS Universal DMG, Windows MSI/EXE, Linux DEB/AppImage)'
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          args: ${{ matrix.tauri-args }}
