name: 🌐 Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 Tag (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release 标题 (选填)'
        required: false
        default: 'NovaStream Release'
      is_prerelease:
        description: '是否为预发布版本 (Pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ========================================================
  # 阶段 1: 全局静态类型检查 (仅在 Linux 上高效执行一次，避免平台原生二进制冲突)
  # ========================================================
  lint-and-typecheck:
    name: 🔍 Type Check & Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: 🔍 Type check (tsc --noEmit)
        run: npm run lint

  # ========================================================
  # 阶段 2: 跨平台并行打包构建 (Linux, Windows, macOS)
  # ========================================================
  build-matrix:
    name: 📦 Build (${{ matrix.platform-name }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 环境
          - os: ubuntu-latest
            platform-name: Linux-x64
            archive-type: tar-and-zip
            shell: bash

          # Windows x64 环境
          - os: windows-latest
            platform-name: Windows-x64
            archive-type: zip-powershell
            shell: pwsh

          # macOS Universal 环境
          - os: macos-latest
            platform-name: macOS-Universal
            archive-type: tar-and-zip
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux / macOS 依赖安装
      # 针对 macOS: 移除非当前平台的 lockfile，防止 npm issue #4828 导致 native bindings 缺失
      - name: 📦 Install dependencies (Unix)
        if: matrix.shell == 'bash'
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -f package-lock.json ]; then
            rm -f package-lock.json
          fi
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # Windows 依赖安装
      # 彻底规避 npm issue #4828 (Cannot find module '@rolldown/binding-win32-x64-msvc'):
      # 移除在 Linux 环境生成的 package-lock.json，强制 npm 为 Windows 实时解析并下载本地原生二进制
      - name: 📦 Install dependencies (Windows)
        if: matrix.shell == 'pwsh'
        run: |
          if (Test-Path "package-lock.json") {
            Write-Host "Removing cross-platform package-lock.json to avoid npm issue #4828..."
            Remove-Item "package-lock.json" -Force
          }
          npm install --legacy-peer-deps

      - name: 🏗️ Build production bundle (Vite)
        run: npm run build

      # Linux / macOS 打包产物与 SHA256 校验和
      - name: 🗜️ Package Bundle (Linux / macOS)
        if: matrix.archive-type == 'tar-and-zip'
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          fi

          mkdir -p artifacts
          ZIP_NAME="NovaStream-${VERSION}-${{ matrix.platform-name }}.zip"
          TAR_NAME="NovaStream-${VERSION}-${{ matrix.platform-name }}.tar.gz"

          # 植入启动便携脚本
          cat << 'EOF' > dist/start.sh
#!/bin/bash
echo "=== Starting NovaStream Cinema Hub ==="
if command -v npx >/dev/null 2>&1; then
  npx --yes serve -s . -l 3000
elif command -v python3 >/dev/null 2>&1; then
  echo "Serving on http://localhost:3000"
  python3 -m http.server 3000
else
  echo "Please open index.html in your browser or run a static web server."
fi
EOF
          chmod +x dist/start.sh

          cd dist
          zip -r "../artifacts/${ZIP_NAME}" ./*
          tar -czf "../artifacts/${TAR_NAME}" ./*
          cd ..

          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ZIP_NAME}" "${TAR_NAME}" > "checksums-${{ matrix.platform-name }}.txt"
          else
            shasum -a 256 "${ZIP_NAME}" "${TAR_NAME}" > "checksums-${{ matrix.platform-name }}.txt"
          fi
          cd ..

      # Windows 打包产物与 SHA256 校验和 (PowerShell 原生支持)
      - name: 🗜️ Package Bundle (Windows)
        if: matrix.archive-type == 'zip-powershell'
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($VERSION) -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.tag_name }}"
          }

          New-Item -ItemType Directory -Force -Path "artifacts"
          $ZIP_NAME = "NovaStream-${VERSION}-${{ matrix.platform-name }}.zip"

          # 植入 Windows 双击启动脚本
          @"
@echo off
title NovaStream Cinema Hub
echo ========================================================
echo  NovaStream Local Cinema Hub
echo  Web Application Distribution
echo ========================================================
echo.
echo Attempting to start local web server on http://localhost:3000 ...
where npx >nul 2>nul
if %ERRORLEVEL% EQU 0 (
    npx --yes serve -s . -l 3000
    goto end
)
where python >nul 2>nul
if %ERRORLEVEL% EQU 0 (
    echo Serving with Python on http://localhost:3000 ...
    python -m http.server 3000
    goto end
)
start index.html
:end
pause
"@ | Out-File -Encoding utf8 "dist/start.bat"

          Compress-Archive -Path "dist/*" -DestinationPath "artifacts/$ZIP_NAME" -Force

          $hash = (Get-FileHash -Algorithm SHA256 "artifacts/$ZIP_NAME").Hash.ToLower()
          "$hash  $ZIP_NAME" | Out-File -Encoding utf8 "artifacts/checksums-${{ matrix.platform-name }}.txt"

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 5

  # ========================================================
  # 阶段 3: 汇总全平台产物并发布 GitHub Release
  # ========================================================
  publish-release:
    name: 🚀 Publish Unified Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Ensure Git Tag Exists (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: 📥 Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: 📋 Merge Checksums & Organize Assets
        run: |
          mkdir -p final_release
          cd release_assets
          cat checksums-*.txt > ../final_release/checksums.txt 2>/dev/null || true
          rm -f checksums-*.txt
          mv NovaStream-* ../final_release/ 2>/dev/null || true
          cd ..

          echo "=== 待发布的文件列表 ==="
          ls -la final_release/

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            final_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
